# Standalone nginx — reverse proxy for beigeboard.jkos.net, auth.jkos.net, sylibos.jkos.net
#
# Joins bb-net, sylibos-net, jkos-auth-net as EXTERNAL networks.
# Start dependent services first:
#
#   cd jkos-auth      && docker compose up -d --build
#   cd BeigeBoard     && docker compose up -d --build
#   cd SylibOS        && docker compose up -d --build
#   cd docker/nginx   && docker compose up -d

services:
  standalone-nginx:
    image: nginx:alpine
    container_name: standalone-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./standalone.conf:/etc/nginx/nginx.conf:ro
      - ${SSL_PATH:-/mnt/Luna/Backends/ssl}:/etc/letsencrypt:ro
      - ${NGINX_LOGS_PATH:-/mnt/Luna/Backends/nginx-standalone-logs}:/var/log/nginx
    networks:
      - bb-net
      - sylibos-net
      - jkos-auth-net

networks:
  bb-net:
    external: true
    name: bb-net
  sylibos-net:
    external: true
    name: sylibos-net
  jkos-auth-net:
    external: true
    name: jkos-auth-net
