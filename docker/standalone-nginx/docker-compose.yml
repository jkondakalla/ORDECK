# Standalone nginx — reverse proxy for beigeboard.jkos.net and sylibos.jkos.net
#
# Joins bb-net and sylibos-net as EXTERNAL networks, so BeigeBoard and SylibOS
# must be started before this container:
#
#   cd BeigeBoard     && docker compose up -d --build
#   cd OpenCourseFlow && docker compose up -d --build   # dir still named OpenCourseFlow/ on disk
#   cd docker/nginx   && docker compose up -d

services:
  standalone-nginx:
    image: nginx:alpine
    container_name: standalone-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./standalone.conf:/etc/nginx/nginx.conf:ro
      - /mnt/Luna/Backends/ssl:/etc/letsencrypt:ro
      - /mnt/Luna/Backends/nginx-standalone-logs:/var/log/nginx
    networks:
      - bb-net
      - sylibos-net

networks:
  bb-net:
    external: true
    name: bb-net
  sylibos-net:
    external: true
    name: sylibos-net
