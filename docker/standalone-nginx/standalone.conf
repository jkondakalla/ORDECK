# Standalone reverse proxy for BeigeBoard and SylibOS subdomains.
# This is SEPARATE from the ORDECK nginx config (ORDECK/docker/nginx/nginx.conf).
#
# Container name:  standalone-nginx
# Networks joined: bb-net      (reaches bb-app:3001)
#                  sylibos-net (reaches sylibos-frontend:80 and sylibos-api:8004)
#
# SSL: Cloudflare Origin Certificate (wildcard *.jkos.net + jkos.net, 15-year validity).
# Stored on host at /mnt/Luna/Backends/ssl, mounted read-only as /etc/letsencrypt.
# No certbot or renewal cron needed.
#   /etc/letsencrypt/live/jkos.net/fullchain.pem
#   /etc/letsencrypt/live/jkos.net/privkey.pem

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile   on;
    tcp_nopush on;
    gzip       on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    real_ip_header    X-Forwarded-For;
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_recursive on;

    # ── Redirect HTTP → HTTPS (both subdomains) ───────────────────────────────
    server {
        listen 80;
        server_name beigeboard.jkos.net sylibos.jkos.net;
        return 301 https://$host$request_uri;
    }

    # ── BeigeBoard ────────────────────────────────────────────────────────────
    # All traffic (frontend SPA + /api/*) is handled by a single Node process.
    # No path prefix stripping needed — BeigeBoard routes are at root.
    server {
        listen 443 ssl http2;
        server_name beigeboard.jkos.net;

        ssl_certificate     /etc/letsencrypt/live/jkos.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jkos.net/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 10m;

        location / {
            proxy_pass         http://bb-app:3001;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }
    }

    # ── SylibOS ───────────────────────────────────────────────────────────────
    # Frontend SPA served by sylibos-frontend (nginx:alpine).
    # Backend API served by sylibos-api (Node.js) at /api/* and /health.
    server {
        listen 443 ssl http2;
        server_name sylibos.jkos.net;

        ssl_certificate     /etc/letsencrypt/live/jkos.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jkos.net/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ZIP course imports can be large
        client_max_body_size 512m;

        # Backend API — SylibOS API routes are at /api/*
        location /api/ {
            proxy_pass         http://sylibos-api:8004;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Health endpoint on the backend
        location /health {
            proxy_pass         http://sylibos-api:8004;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Frontend SPA — served by sylibos-frontend nginx with try_files fallback
        location / {
            proxy_pass         http://sylibos-frontend:80;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
