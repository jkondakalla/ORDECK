services:
  auth:
    build:
      context: ../../services/auth-api
    container_name: ordeck-auth
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /mnt/YOUR_TRUENAS_POOL/auth-data:/data
    env_file: .env
    networks:
      - ordeck-net

networks:
  ordeck-net:
    external: true
