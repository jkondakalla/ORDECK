# ORDECK · Production Nginx Config
# Domain: YOUR_DOMAIN  (e.g. hub.yourdomain.com)
# TrueNAS Scale 25.04 · Docker-based deployment
#
# Service map (all on ordeck-net Docker network):
#   shell        → ordeck-shell:3000
#   auth-api     → ordeck-auth:8000
#   plex-api     → ordeck-plex:8001
#   recipe-api   → ordeck-recipe:8002
#   lazuros-api  → ordeck-lazuros:8003
#   beigeboard   → beigeboard-api:3001  (separate stack, same network)
#
# Plugin static assets (Module Federation remoteEntry.js):
#   beigeboard-plugin → ordeck-plugin-beigeboard:3003
#   lazuros-plugin    → ordeck-plugin-lazuros:3004
#   plex-plugin       → ordeck-plugin-plex:3005
#   recipe-plugin     → ordeck-plugin-recipe:3006

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    gzip        on;
    gzip_types  text/plain text/css application/json application/javascript text/xml;

    # ── Pass real client IP through proxy ─────────────────────────────────────
    real_ip_header     X-Forwarded-For;
    set_real_ip_from   10.0.0.0/8;
    set_real_ip_from   172.16.0.0/12;
    set_real_ip_from   192.168.0.0/16;
    real_ip_recursive  on;

    # ── Redirect HTTP → HTTPS ────────────────────────────────────────────────
    server {
        listen 80;
        server_name YOUR_DOMAIN;
        return 301 https://$host$request_uri;
    }

    # ── Main HTTPS server ─────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name YOUR_DOMAIN;

        ssl_certificate     /etc/nginx/ssl/YOUR_DOMAIN.crt;
        ssl_certificate_key /etc/nginx/ssl/YOUR_DOMAIN.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Auth service ──────────────────────────────────────────────────────
        location /api/auth/ {
            proxy_pass         http://ordeck-auth:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
        }

        # ── Plex API ──────────────────────────────────────────────────────────
        location /api/plex/ {
            proxy_pass         http://ordeck-plex:8001;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
        }

        # ── Recipe API ────────────────────────────────────────────────────────
        location /api/recipes/ {
            proxy_pass         http://ordeck-recipe:8002;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
        }

        # ── LazurOS API ───────────────────────────────────────────────────────
        # Note: LazurOS proxies long-running AI requests — no read timeout
        location /api/lazuros/ {
            proxy_pass             http://ordeck-lazuros:8003;
            proxy_http_version     1.1;
            proxy_set_header       Host               $host;
            proxy_set_header       X-Real-IP          $remote_addr;
            proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto  $scheme;
            proxy_read_timeout     0;
            proxy_send_timeout     0;
            proxy_buffering        off;
            proxy_cache            off;
            # Keep SSE / streaming connections alive
            proxy_set_header       Connection "";
            chunked_transfer_encoding on;
        }

        # ── BeigeBoard API ────────────────────────────────────────────────────
        # Deployed in the BeigeBoard stack but accessible on the same network
        location /api/beigeboard/ {
            proxy_pass         http://beigeboard-api:3001/;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
        }

        # ── Plugin static assets (Module Federation remoteEntry.js) ───────────
        # Each plugin is a separate container serving its Vite build output.
        location /plugins/beigeboard/ {
            proxy_pass http://ordeck-plugin-beigeboard:3003/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Access-Control-Allow-Origin "https://YOUR_DOMAIN" always;
        }

        location /plugins/lazuros/ {
            proxy_pass http://ordeck-plugin-lazuros:3004/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Access-Control-Allow-Origin "https://YOUR_DOMAIN" always;
        }

        location /plugins/plex/ {
            proxy_pass http://ordeck-plugin-plex:3005/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Access-Control-Allow-Origin "https://YOUR_DOMAIN" always;
        }

        location /plugins/recipe/ {
            proxy_pass http://ordeck-plugin-recipe:3006/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Access-Control-Allow-Origin "https://YOUR_DOMAIN" always;
        }

        # ── Shell (catch-all) ─────────────────────────────────────────────────
        location / {
            proxy_pass         http://ordeck-shell:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade            $http_upgrade;
            proxy_set_header   Connection         "upgrade";
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
