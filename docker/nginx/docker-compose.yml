services:
  nginx:
    image: nginx:1.27-alpine
    container_name: ordeck-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${SSL_PATH:-/mnt/Luna/Backends/ssl}/jkos.net.crt:/etc/nginx/ssl/jkos.net.crt:ro
      - ${SSL_PATH:-/mnt/Luna/Backends/ssl}/jkos.net.key:/etc/nginx/ssl/jkos.net.key:ro
      - ${NGINX_LOGS_PATH:-/mnt/Luna/Backends/nginx-ordeck-logs}:/var/log/nginx
    # host-gateway lets nginx reach LazurOS which runs on the host network (required for WoL)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ordeck-net
    # nginx should start after all app containers are up
    depends_on: []

networks:
  ordeck-net:
    external: true
