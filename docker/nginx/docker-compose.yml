services:
  nginx:
    image: nginx:1.27-alpine
    container_name: ordeck-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Place your SSL cert + key here on the TrueNAS host:
      - /mnt/YOUR_TRUENAS_POOL/ssl/YOUR_DOMAIN.crt:/etc/nginx/ssl/YOUR_DOMAIN.crt:ro
      - /mnt/YOUR_TRUENAS_POOL/ssl/YOUR_DOMAIN.key:/etc/nginx/ssl/YOUR_DOMAIN.key:ro
      - /mnt/YOUR_TRUENAS_POOL/nginx-logs:/var/log/nginx
    networks:
      - ordeck-net
    # nginx should start after all app containers are up
    depends_on: []

networks:
  ordeck-net:
    external: true
