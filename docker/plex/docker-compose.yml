services:
  plex-widget:
    build:
      context: ../../
      dockerfile: docker/plex/Dockerfile.widget
    container_name: ordeck-plex-widget
    restart: unless-stopped
    ports:
      - "3001:80"
    networks:
      - ordeck-net

  plex-api:
    build:
      context: ../../services/plex-api
    container_name: ordeck-plex-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file: .env
    volumes:
      - /mnt/truenas/plex-data:/data
    networks:
      - ordeck-net

networks:
  ordeck-net:
    external: true
